# Genera los manuales en Word y la guía visual en PDF a partir de docs/manuales/*.md
# y los adjunta a cada publicación. Así no se versionan binarios que se
# desincronizan del texto fuente (ver CLAUDE.md, «Documenta lo que cambies»).
name: Manuales

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar dependencias de los generadores
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          python3 -m venv .venv
          .venv/bin/pip install -q python-docx reportlab
      - name: Generar Word y PDF
        run: |
          .venv/bin/python docs/manuales/generar-word.py
          .venv/bin/python docs/manuales/generar-guia-visual.py
      - uses: actions/upload-artifact@v4
        with:
          name: manuales
          path: output/
      - name: Adjuntar a la publicación
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" output/word/*.docx output/pdf/*.pdf --clobber
